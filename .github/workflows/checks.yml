name: Source and controller checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Pillow
      - name: Install preview test dependencies
        run: |
          # Avoid stalled Azure mirror downloads before the tests can start.
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf '%s\n' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors-security.txt >/dev/null
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg liblz4-1
      - name: Bubble geometry checks
        run: |
          c++ -std=c++23 -O2 -Wall -Wextra tests/test_bubble_motion.cpp -o /tmp/bubble-motion-test
          /tmp/bubble-motion-test
      - name: Compile Python sources
        run: python -m compileall -q scripts tests wallpaperengine
      - name: Installation snapshot tests
        run: python -m unittest discover -s tests -v
      - name: Library synchronization and preview tests
        run: python -m unittest discover -s wallpaperengine/tests -p test_library_sync.py -v
      - name: Local folder and independent renderer tests
        run: python -m unittest discover -s wallpaperengine/tests -p test_local_folders.py -v
      - name: Wallpaper transition lifecycle tests
        run: python -m unittest discover -s wallpaperengine/tests -p test_transition.py -v
      - name: Session startup regressions
        run: python -m unittest discover -s wallpaperengine/tests -p test_session.py -v
      - name: High-resolution login image regressions
        run: python -m unittest discover -s wallpaperengine/tests -p test_login_wallpaper.py -v
      # Full palette tests require an installed Caelestia CLI and its Python
      # dependencies. Native motion tests additionally require the target desktop.
